# One release, everywhere: push a version tag (v1.2.0) and this builds
#   - the Android app (XIFO.apk),
#   - the PC app for Windows (XIFO-Setup-<version>.exe) and Linux (XIFO-<version>.AppImage),
#   - the web version (xifo-web.tar.gz), which the hub puts on xiforever.com/app by itself within 10 minutes,
# and publishes them together as one GitHub release. The PC app shows the live web version, so it is up to date as
# soon as the website is. Run by hand (Actions tab > Release > Run workflow) to build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the web version (served at xiforever.com/app)
        run: |
          node scripts/bundle-wiki.js
          npx expo export --platform web --output-dir dist-web
          tar czf xifo-web.tar.gz -C dist-web .
          sha256sum xifo-web.tar.gz > xifo-web.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with: { name: web, path: 'xifo-web.tar.gz*' }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Make the Android project
        run: |
          node scripts/bundle-wiki.js
          npx expo prebuild --platform android --no-install --clean
      - name: Signing key
        env:
          KEY_B64: ${{ secrets.XIFO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/xifo-release.jks"
            echo "XIFO_KEYSTORE=$RUNNER_TEMP/xifo-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No XIFO_KEYSTORE_BASE64 secret: this APK is signed with the debug key (fine for testing, not for releases)."
          fi
      - name: Build
        working-directory: android
        env:
          XIFO_KEYSTORE_PASSWORD: ${{ secrets.XIFO_KEYSTORE_PASSWORD }}
          XIFO_KEY_ALIAS: ${{ secrets.XIFO_KEY_ALIAS }}
          XIFO_KEY_PASSWORD: ${{ secrets.XIFO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/XIFO-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk out/XIFO.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Build the PC app
        working-directory: desktop
        shell: bash
        run: |
          VERSION=$(node -p "require('../app.json').expo.version")
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "XIFO app $GITHUB_REF_NAME" --notes "**Android:** download XIFO.apk on your phone and open it (allow installing from your browser when asked); updates install over the old version.
          **Windows:** XIFO-Setup-*.exe.  **Linux / Steam Deck:** XIFO-*.AppImage (make it executable, then run it).
          **No install:** https://xiforever.com/app (updated within 10 minutes of this release; the PC app shows it too)."
